<style>
/* Dirección: herramienta propia de Gambito, con los valores del sitio gambito.us: fondo #08072A, índigo #4C31FB, lavandas #A9A4FF /
   #D2CFFF / #E9E7FF, superficie clara #F6F5FF, botones en píldora y tarjetas de radio grande, DM Sans con títulos medianos y
   tracking apretado. El lado izquierdo es el panel oscuro de marca; la ficha sigue siendo papel blanco como el documento exportado. */
:root{
  --bg:#F6F5FF; --paper:#FFFFFF; --ink:#08072A; --muted:#5F5E78; --line:#E1DFF1; --label:#F6F5FF;
  --navy:#3D29C1; --on-navy:#FFFFFF; --accent:#4C31FB; --on-accent:#FFFFFF; --accent-soft:#E9E7FF;
  --brand-grad:linear-gradient(100deg,#130E51,#3D29C1);
  --prim-grad:linear-gradient(135deg,#4C31FB,#3D29C1);
  --warn:#7A4E00; --warn-bg:#FFF3D1; --warn-line:#E2B33A; --ok:#176B45; --ok-bg:#DDF3E8; --bad:#A8231B; --bad-bg:#FBE4E2;
  --shadow:0 1px 2px rgba(20,14,85,.06),0 14px 36px rgba(20,14,85,.09);
  --font:"DM Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --display:"PP Mori","DM Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08072A; --paper:#130E51; --ink:#F2F0FF; --muted:#A9A4D8; --line:#2E2A72; --label:#1A1568;
    --navy:#3D29C1; --brand-grad:linear-gradient(100deg,#2B21A6,#4C31FB); --on-navy:#FFFFFF; --accent:#A9A4FF; --on-accent:#08072A; --accent-soft:#251E86;
    --warn:#F0C766; --warn-bg:#3A3118; --warn-line:#B88F1E; --ok:#6FD3A1; --ok-bg:#163326; --bad:#FF9C94; --bad-bg:#3E1B19;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 14px 36px rgba(0,0,0,.42);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08072A; --paper:#130E51; --ink:#F2F0FF; --muted:#A9A4D8; --line:#2E2A72; --label:#1A1568;
  --navy:#3D29C1; --brand-grad:linear-gradient(100deg,#2B21A6,#4C31FB); --on-navy:#FFFFFF; --accent:#A9A4FF; --on-accent:#08072A; --accent-soft:#251E86;
  --warn:#F0C766; --warn-bg:#3A3118; --warn-line:#B88F1E; --ok:#6FD3A1; --ok-bg:#163326; --bad:#FF9C94; --bad-bg:#3E1B19;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 14px 36px rgba(0,0,0,.42);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}

.side>*{position:relative;z-index:1}
.main{overflow:auto;min-width:0;position:relative}

/* sidebar */
.brand{padding:20px 18px 14px}
.brand .wm{display:block;height:30px;width:auto;margin:0 0 14px}
.brand h1{margin:0;font:500 19px/1.2 var(--display);letter-spacing:-.02em}
.brand p{margin:4px 0 0;color:#D1CBFF;font-size:12px}
.side-tools{display:flex;gap:8px;padding:0 18px 12px;align-items:center;justify-content:space-between}
.side .btn.new{padding:8px 16px;font-weight:600}
.side-find{padding:0 18px 12px}
.side-search{width:100%;border:1px solid rgba(210,207,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 14px;outline:none}
.side-search::placeholder{color:#B9B3F0}
.side-search:focus-visible{border-color:#fff}
.vac .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.side .chip{font-size:11.5px;padding:1px 8px}
.side .chip.bad{background:rgba(255,156,148,.2);color:#FFB4AE}
.side .chip.warn{background:rgba(240,199,102,.2);color:#FFD98A}
.side .chip.info{background:rgba(169,164,255,.22);color:#E4E1FF}
.side .chip.closed{background:rgba(255,255,255,.14);color:#D1CBFF}
.seg{display:inline-flex;border:1px solid rgba(210,207,255,.3);border-radius:999px;overflow:hidden;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 12px;cursor:pointer;font:500 12px var(--font);letter-spacing:.06em;color:#D1CBFF;border-radius:999px}
.seg button:hover{background:rgba(255,255,255,.12)}
.seg button[aria-pressed="true"]{background:#fff;color:#08072A}
.side .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.34);color:#fff}
.side .btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.6)}
.side .btn.primary{background:#fff;border-color:#fff;color:#08072A}
.side :focus-visible{outline-color:#fff}
.vac-list{flex:1;overflow:auto;border-top:1px solid rgba(255,255,255,.18)}
.vac{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid rgba(255,255,255,.12);border-left:3px solid transparent;background:transparent;color:#fff;padding:12px 16px;cursor:pointer}
.vac:hover{background:rgba(255,255,255,.09)}
.vac[aria-current="true"]{background:rgba(210,207,255,.14);border-left-color:#A9A4FF}
.vac .c{font-size:12px;color:#D1CBFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vac .r{font:500 15px/1.25 var(--display);letter-spacing:-.01em;margin:2px 0 6px;overflow-wrap:anywhere}
.vac .m{display:flex;gap:8px;align-items:center;font-size:11.5px;color:#D1CBFF}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mini{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.side .mini{background:rgba(255,255,255,.22)}
.side .mini i{background:#A9A4FF}
.empty{padding:22px 18px;color:var(--muted)}
.empty b{color:var(--ink)}
.side .empty{color:#E9E7FF}
.side .empty b{color:#fff}
.empty .btn{margin-top:12px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 15px;cursor:pointer;font:500 13px var(--font);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--prim-grad);border-color:transparent;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 12px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barra superior */
.bar::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#130E51,#4C31FB 55%,#A9A4FF)}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:13px 20px 10px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.bar{justify-content:space-between;align-items:flex-start}
.bar .ttl{flex:1 1 320px;min-width:0}
.bar .ttl b{display:block;font:500 19px/1.25 var(--display);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .ttl span{font-size:12px;color:var(--muted)}
.score{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.score .mini{width:90px;flex:none;height:6px}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}
.sub2{display:flex;gap:16px;align-items:center;margin-top:5px;flex-wrap:wrap}
.save{font-size:12px;color:var(--muted)}
.save.err{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:relative;justify-content:flex-end}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);min-width:250px;padding:6px;z-index:8}
.menu button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:6px;padding:8px 10px;cursor:pointer}
.menu button:hover{background:var(--label)}

/* ficha */
.sheet{max-width:940px;margin:22px auto 80px;padding:0 16px}
.paper{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;overflow:hidden}
.banner{margin:0 0 12px;padding:11px 18px;border-radius:20px;background:var(--accent-soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner .grow{flex:1 1 240px}
.qcard{margin:0 0 12px;border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:20px;padding:13px 18px;color:var(--ink)}
.qcard h3{margin:0 0 6px;font-size:13px;color:var(--warn)}
.qcard ol{margin:0 0 8px;padding-left:20px}
.qcard li{margin:2px 0}
.qcard .row{display:flex;gap:8px}
.bar-sec{background:var(--brand-grad);color:var(--on-navy);font:500 13.5px var(--font);letter-spacing:.02em;text-align:center;padding:7px 10px;border-bottom:1px solid var(--navy)}
.bar-sec.big{font:500 18px var(--display);letter-spacing:-.01em;padding:12px 10px}
.bar-sec.left{text-align:left}
.line{display:grid;grid-template-columns:232px minmax(0,1fr);border-bottom:1px solid var(--line)}
.lab{background:var(--label);padding:8px 12px;display:flex;align-items:center;font-size:13px;border-right:1px solid var(--line)}
.val{min-width:0;position:relative}
.val input:not([type=checkbox]),.val textarea,.val select,.cell input,.cell select,.cell textarea{width:100%;border:0;background:transparent;padding:8px 10px;outline:none;display:block;border-radius:0}
.hv input,.hv select{width:100%;border:0;background:transparent;padding:8px 10px;outline:none;display:block;font-weight:600;border-radius:0}
.hv input:focus-visible,.hv select:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.val textarea,.cell textarea{resize:vertical;line-height:1.4;min-height:38px}
.val input:focus-visible,.val textarea:focus-visible,.val select:focus-visible,.cell input:focus-visible,.cell select:focus-visible,.cell textarea:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.val select,.cell select{background-color:transparent;cursor:pointer}
.val select option,.cell select option{background:var(--paper);color:var(--ink)}
.ghost::placeholder{color:var(--muted);font-style:italic;opacity:.8}
.gap .val{background:var(--warn-bg);box-shadow:inset 3px 0 0 var(--warn-line)}
.gap.is-tbl{background:var(--warn-bg)}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:7px 8px}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;cursor:pointer}
.pill:hover{border-color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.head3{display:grid;grid-template-columns:232px minmax(0,1fr) 200px minmax(0,1fr) 90px minmax(0,1fr);border-bottom:1px solid var(--line)}
.head3 .hl{background:var(--brand-grad);color:var(--on-navy);font:500 13px var(--font);display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:13px}
.head3 .hv{background:var(--label);font-weight:600;color:var(--navy);min-width:0}
:root[data-theme="dark"] .head3 .hv{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .head3 .hv{color:var(--ink)}}
.sal{display:grid;grid-template-columns:232px minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1.2fr) minmax(0,1.7fr);border-bottom:1px solid var(--line)}
.sal .lab{grid-row:span 2}
.sal .cap{background:var(--label);font-size:11px;font-weight:600;text-align:center;padding:4px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.sal .cell{border-left:1px solid var(--line);min-width:0}
.tbl{border-bottom:1px solid var(--line)}
.tr{display:grid;border-top:1px solid var(--line);align-items:stretch}
.tr:first-child{border-top:0}
.tr.th{background:var(--label);font-size:12px;font-weight:600}
.tr.th>div{padding:6px 8px;display:flex;align-items:center}
.cell{min-width:0;border-left:1px solid var(--line)}
.cell:first-child{border-left:0}
.cm{grid-template-columns:minmax(0,2.4fr) 96px 112px 92px minmax(0,1.6fr) 34px}
.cn{grid-template-columns:minmax(0,2.4fr) 96px 92px minmax(0,1.6fr) 34px}
.cs{grid-template-columns:minmax(0,2.4fr) 92px minmax(0,1.6fr) 34px}
.cp{grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 62px}
.tr.th .title{font-size:13px}
.tbl-foot{display:flex;gap:12px;align-items:center;padding:6px 8px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.open{background:var(--ok-bg);color:var(--ok)}
.chip.paused{background:var(--warn-bg);color:var(--warn)}
.chip.closed,.chip.mute{background:var(--label);color:var(--muted)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--accent-soft);color:var(--navy)}
:root[data-theme="dark"] .chip.info{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.info{color:var(--ink)}}
button.chip{border:0;font-family:inherit;line-height:inherit}
.chip.act{cursor:pointer}
.chip.act:hover{filter:brightness(.95);box-shadow:0 0 0 1px var(--warn-line) inset}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 6px;font-size:16px;line-height:1}
.x:hover{color:var(--bad)}
.mv{display:flex;align-items:center;justify-content:center;gap:0}
.mv button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 3px}
.mv button:hover{color:var(--ink)}
.spacer{height:12px}
.flash{animation:flash 2.6s ease-out}
@keyframes flash{from{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}to{background:transparent;box-shadow:none}}
@media (prefers-reduced-motion: reduce){.flash{animation:none;box-shadow:inset 0 0 0 2px var(--accent)}}

/* pestañas Cliente / Proyecto / Rol */
.meta{margin-bottom:12px}
.meta .head3{border-bottom:0}
.tabs{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 8px 7px 18px;font:500 14.5px var(--font);cursor:pointer}
.tab:hover{border-color:var(--muted)}
.tab[aria-selected="true"]{background:var(--prim-grad);border-color:transparent;color:#fff}
.tn{min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;font:600 11.5px var(--font);font-variant-numeric:tabular-nums}
.tn.warn{background:var(--warn-bg);color:var(--warn)}
.tn.ok{background:var(--ok-bg);color:var(--ok)}
.tab[aria-selected="true"] .tn{background:rgba(255,255,255,.22);color:#fff}
.combo{display:flex;align-items:center;gap:8px;padding-right:8px}
.combo input{flex:1 1 auto;min-width:0}
.combo .chip,.combo .btn{flex:none}
.empty.light{padding:18px 16px;line-height:1.5}

/* sugerencias y atajos (chips) */
.sug{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 8px}
.pill.sm{padding:1px 10px;font-size:12px;color:var(--muted);background:transparent;border-style:dashed}
.pill.sm:hover{color:var(--ink);border-color:var(--accent)}
.pill.sm[aria-pressed="true"]{background:var(--accent-soft);border:1px solid var(--accent);border-style:solid;color:var(--navy);font-weight:600}
:root[data-theme="dark"] .pill.sm[aria-pressed="true"]{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.sm[aria-pressed="true"]{color:var(--ink)}}
.btn.icon{padding:6px 12px;font-size:16px;line-height:1;letter-spacing:.08em}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .danger{color:var(--bad)}
.hero{padding:44px 28px 48px;text-align:center}
.hero h2{margin:0 0 8px;font:500 24px/1.2 var(--display);letter-spacing:-.02em}
.hero p{margin:0 auto 20px;max-width:430px;color:var(--muted);font-size:14.5px;line-height:1.5}
.hero .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hero .btn{padding:9px 20px;font-size:14px}

/* versión independiente: pie de la barra lateral y pantalla de conexión */
.side-foot[hidden]{display:none}
.side-foot{display:flex;align-items:center;gap:6px;padding:10px 18px;border-top:1px solid rgba(255,255,255,.18);font-size:12px;color:#D1CBFF;min-width:0;background:rgba(8,7,42,.55)}
.side-foot b{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.linkbtn{margin-left:auto;border:0;background:transparent;color:#fff;text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
.dlg.conn{max-width:500px;overflow:hidden}
.conn-top{background:#08072A;padding:18px 24px}
.conn-top img{display:block;height:28px;width:auto}
.conn .bd{padding:22px 24px 8px}
.conn-h{margin:0;font:500 22px/1.2 var(--display);letter-spacing:-.02em}
.conn .hint{line-height:1.55}
.conn-err{margin:0;color:var(--bad);font-size:12.5px}
.conn footer{border-top:0;padding:14px 24px 22px}

/* bloques de requisitos */
.subbar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--accent-soft);border-left:4px solid var(--accent);border-bottom:1px solid var(--line)}
.subbar b{font:500 16px var(--display);letter-spacing:-.01em}
.subbar span{color:var(--muted);font-size:12.5px}
.tbl+.tbl{border-top:1px solid var(--line)}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(8,7,42,.62);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--paper);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);width:100%;max-width:720px;max-height:92%;display:flex;flex-direction:column}
.dlg header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dlg header h2{margin:0;font:500 19px var(--display);letter-spacing:-.02em;flex:1}
.dlg .bd{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg textarea.big{width:100%;min-height:220px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper);resize:vertical}
.dlg .out{white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--label);min-height:120px;font-size:13.5px}
.dlg .hint{color:var(--muted);font-size:13px;margin:0}
.dlg .res{border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:13px}
.dlg label.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.4s}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:999px;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{max-height:230px}
  .side::after{display:none}
  .brand .wm{height:24px;margin-bottom:8px}
  .brand{padding:10px 14px 6px}
  .line{grid-template-columns:1fr}
  .lab{border-right:0;padding:6px 12px 2px;background:transparent;font-weight:600;color:var(--muted);font-size:12px}
  .head3,.sal{grid-template-columns:1fr 1fr}
  .head3 .hl{justify-content:flex-start}
  .sal .lab{grid-row:auto;grid-column:1/-1}
  .tr{grid-template-columns:1fr 1fr!important}
  .tr.th{display:none}
  .tr>.cell:first-child{grid-column:1/-1}
  .bar{padding:10px 14px}
}

.conn-ver{margin:14px 0 0;font-size:11px;color:var(--muted);opacity:.8}

.conn-diag{margin:12px 0 0;font-size:12px;color:var(--muted)}
.conn-diag summary{cursor:pointer}
.conn-diag pre{margin:8px 0;padding:8px 10px;background:var(--label);border-radius:8px;white-space:pre-wrap;word-break:break-word;font:11px/1.45 ui-monospace,Consolas,monospace;color:var(--ink)}
.conn-box{margin:8px 0 12px;display:flex;gap:8px;align-items:flex-start}
.conn-pre{flex:1;margin:0;padding:8px 10px;background:var(--label);border-radius:8px;white-space:pre-wrap;word-break:break-all;font:11.5px/1.45 ui-monospace,Consolas,monospace;color:var(--ink)}
.dlg.conn .bd{max-height:68vh;overflow:auto}
.dlg .linkbtn{color:#4326E0;margin-left:0;flex:none;align-self:center}
.conn-diag .linkbtn{margin-top:2px}

</style>
</head>
<body>
<div class="app">
  <aside id="side" class="side" aria-label="Vacantes"></aside>
  <main class="main">
    <header id="bar" class="bar"></header>
    <div class="sheet"><div id="banner"></div><article id="sheet"></article></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

const LOCAL_KEY = 'fichas-gambito-local';
function makeLocalDb() {
  const load = () => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch { return {}; } };
  const subs = {};
  const emit = col => { const d = load()[col] || {}, docs = Object.entries(d).map(([id, v]) => ({ id, data: () => JSON.parse(JSON.stringify(v)) })); (subs[col] || []).forEach(l => l.next({ docs })); };
  const write = (col, fn) => { const all = load(); all[col] = all[col] || {}; fn(all[col]); try { localStorage.setItem(LOCAL_KEY, JSON.stringify(all)); } catch (e) { e.code = 'error'; throw e; } emit(col); };
  return {
    doc(path) { const [col, id] = path.split('/'); return { id, path, async set(data) { write(col, d => { d[id] = JSON.parse(JSON.stringify(data)); }); }, async delete() { write(col, d => { delete d[id]; }); } }; },
    collection(col) { return { onSnapshot(next, err) { const l = { next, err }; (subs[col] = subs[col] || new Set()).add(l); setTimeout(() => emit(col), 0); return () => subs[col].delete(l); } }; }
  };
}

/* ---------- inicio de sesión de Microsoft (código + PKCE, sin librerías) */
const REDIRECT = () => location.origin + location.pathname.replace(/index\.html$/, '');
const authBase = () => 'https://login.microsoftonline.com/' + encodeURIComponent(cfg.tenantId || 'organizations') + '/oauth2/v2.0';
const TOK_KEY = () => 'fg-tok:' + cfg.clientId, HINT_KEY = () => 'fg-hint:' + cfg.clientId;
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const rand = n => b64u(crypto.getRandomValues(new Uint8Array(n)));
const sha256 = async s => b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)));
const claims = jwt => { try { const p = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(decodeURIComponent(escape(atob(p)))); } catch { return {}; } };
const readTok = () => { try { return JSON.parse(localStorage.getItem(TOK_KEY())); } catch { return null; } };
const writeTok = t => { try { localStorage.setItem(TOK_KEY(), JSON.stringify(t)); } catch { } };
class GErr extends Error { constructor(status, code, msg, extra) { super(msg); this.status = status; this.code = code; Object.assign(this, extra || {}); } }

async function startLogin(mode) {   // mode: 'silent' | 'pick' | undefined
  const verifier = rand(48), state = rand(16);
  sessionStorage.setItem('fg-auth', JSON.stringify({ verifier, state, mode: mode || '' }));
  const p = new URLSearchParams({ client_id: cfg.clientId, response_type: 'code', redirect_uri: REDIRECT(), response_mode: 'query', scope: SCOPES, state, code_challenge: await sha256(verifier), code_challenge_method: 'S256' });
  const hint = localStorage.getItem(HINT_KEY());
  if (mode === 'silent' && hint) { p.set('prompt', 'none'); p.set('login_hint', hint); sessionStorage.setItem('fg-silent', String(Date.now())); }
  else if (mode === 'pick') p.set('prompt', 'select_account');
  else if (hint) p.set('login_hint', hint);
  location.assign(authBase() + '/authorize?' + p);
}
async function tokenRequest(params) {
  let r;
  try { r = await fetch(authBase() + '/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: cfg.clientId, scope: SCOPES, ...params }) }); }
  catch { throw new GErr(0, 'offline', 'Sin conexión con Microsoft'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new GErr(r.status, j.error === 'invalid_grant' || j.error === 'interaction_required' ? 'auth' : 'error', j.error_description || j.error || ('HTTP ' + r.status), { aad: j.error, trace: j.trace_id });

}
function saveTokens(j, prev) {
  const c = j.id_token ? claims(j.id_token) : {};
  const t = { access: j.access_token, exp: Date.now() + (j.expires_in || 3600) * 1000, refresh: j.refresh_token || (prev && prev.refresh) || '', name: c.name || (prev && prev.name) || '', user: c.preferred_username || c.upn || c.email || (prev && prev.user) || '' };
  writeTok(t); if (t.user) { try { localStorage.setItem(HINT_KEY(), t.user); } catch { } }
  return t;
}
async function handleCallback() {   // devuelve null si la URL no es un regreso del inicio de sesión; si lo es, un objeto con el resultado
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return null;
  const st = JSON.parse(sessionStorage.getItem('fg-auth') || 'null');
  history.replaceState(null, '', REDIRECT());
  if (!st || q.get('state') !== st.state) return { error: 'state', description: 'La respuesta de inicio de sesión no coincide con el pedido (probá de nuevo).' };
  sessionStorage.removeItem('fg-auth');
  if (q.has('error')) return { error: q.get('error'), description: q.get('error_description') || '', mode: st.mode };
  try { saveTokens(await tokenRequest({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: REDIRECT(), code_verifier: st.verifier })); sessionStorage.removeItem('fg-silent'); return { ok: true }; }
  catch (e) { return { error: e.aad || 'token', description: e.message, trace: e.trace }; }
}
let refreshing = null;
async function token(force) {
  const t = readTok();
  if (!force && t && t.access && t.exp - 120000 > Date.now()) return t.access;
  if (t && t.refresh) {
    refreshing = refreshing || tokenRequest({ grant_type: 'refresh_token', refresh_token: t.refresh }).then(j => saveTokens(j, t)).finally(() => { refreshing = null; });
    try { return (await refreshing).access; } catch (e) { if (e.code === 'offline') throw e; }
  }
  throw new GErr(401, 'auth', 'La sesión venció');
}
const signOut = () => { try { localStorage.removeItem(TOK_KEY()); localStorage.removeItem(HINT_KEY()); sessionStorage.clear(); } catch { } location.assign(REDIRECT()); };

/* ---------- Microsoft Graph */
async function gerr(r) {
  const j = await r.json().catch(() => ({})), m = (j.error && (j.error.message || j.error.code)) || ('HTTP ' + r.status);
  return new GErr(r.status, r.status === 401 ? 'auth' : r.status === 403 ? 'invalid_argument' : r.status === 404 ? 'notfound' : r.status === 429 ? 'rate_limited' : 'error', m, { gcode: j.error && j.error.code, rid: r.headers.get('request-id') || '', url: r.url });
}
async function gfetch(path, init, tries) {
  init = init || {}; tries = tries || 0;
  const t = await token(init._force);
  let r;
  try { r = await fetch(/^https?:/.test(path) ? path : GRAPH + path, { ...init, headers: { Authorization: 'Bearer ' + t, ...(init.headers || {}) } }); }
  catch { throw new GErr(0, 'offline', 'Sin conexión'); }
  if (r.status === 401 && !init._force) return gfetch(path, { ...init, _force: true }, tries);
  if ((r.status === 429 || r.status === 503) && tries < 3) { await sleep(Math.min(20, +r.headers.get('Retry-After') || 2) * 1000); return gfetch(path, init, tries + 1); }
  return r;
}

async function child(drive, parent, name) {
  const r = await gfetch('/drives/' + drive + '/items/' + parent + ':/' + encodeURIComponent(name));
  if (r.status === 404) return null; if (!r.ok) throw await gerr(r); return r.json();
}
async function ensureChild(drive, parent, name, create) {
  const it = await child(drive, parent, name); if (it) return it;
  if (!create) throw new GErr(404, 'notfound', 'No encuentro la carpeta «' + name + '» en SharePoint.');
  const r = await gfetch('/drives/' + drive + '/items/' + parent + '/children', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, folder: {}, '@microsoft.graph.conflictBehavior': 'fail' }) });
  if (r.status === 409) return child(drive, parent, name);   // otra persona la creó justo ahora
  if (!r.ok) throw await gerr(r); return r.json();
}
async function locate() {   // sitio → biblioteca → carpeta de trabajo → clients / vacancies
  const site = await gjson('/sites/' + cfg.site);
  let drive;
  if (cfg.library) { const l = await gjson('/sites/' + site.id + '/drives'); drive = (l.value || []).find(d => d.name === cfg.library); if (!drive) throw new GErr(404, 'notfound', 'No encuentro la biblioteca «' + cfg.library + '» en el sitio.'); }
  else drive = await gjson('/sites/' + site.id + '/drive');
  const root = await gjson('/drives/' + drive.id + '/root');
  let parent = root.id; const segs = (cfg.folder || '').split('/').map(s => s.trim()).filter(Boolean);
  for (let i = 0; i < segs.length; i++) parent = (await ensureChild(drive.id, parent, segs[i], i === segs.length - 1)).id;
  const cols = {}; for (const c of ['clients', 'vacancies']) cols[c] = (await ensureChild(drive.id, parent, c, true)).id;

}

  const notify = col => { const c = cacheOf(col); for (const l of subs[col] || []) if (l.seen !== c.ver) { l.seen = c.ver; l.next({ docs: c.docs }); } };

    const u = it['@microsoft.graph.downloadUrl'];
    if (u) { try { const r = await fetch(u); if (r.ok) return r.text(); } catch { /* cae al camino con credenciales */ } }
    const r = await gfetch('/drives/' + ctx.drive + '/items/' + it.id + '/content'); if (!r.ok) throw await gerr(r); return r.text();
  }
  async function refresh(col) {
    const c = cacheOf(col), items = []; let url = '/drives/' + ctx.drive + '/items/' + ctx.cols[col] + '/children?$top=200';
    while (url) { const j = await gjson(url); items.push(...(j.value || [])); url = j['@odata.nextLink'] || null; }
    const seen = new Set(), todo = []; let changed = false;
    for (const it of items) { if (!it.file || !/\.json$/.test(it.name)) continue; seen.add(it.name); const prev = c.files.get(it.name); if (!prev || prev.eTag !== it.eTag) todo.push(it); }
    let i = 0;
    await Promise.all(Array.from({ length: Math.min(4, todo.length) }, async () => {
      while (i < todo.length) {
        const it = todo[i++];
        try { c.files.set(it.name, { id: it.id, eTag: it.eTag, data: JSON.parse(await download(it)) }); changed = true; }
        catch (e) { if (e.code === 'auth') throw e; /* archivo a medio sincronizar: se reintenta en la próxima vuelta */ }
      }
    }));
    for (const name of [...c.files.keys()]) if (!seen.has(name)) { c.files.delete(name); changed = true; }
    if (changed) rebuild(c);
  }
  let fails = 0;
  async function kick(col) {
    if (running[col]) { pending[col] = true; return; }
    running[col] = true;
    try { await refresh(col); notify(col); fails = 0; }
    catch (e) { if (e.code === 'auth') authLost(); else if (++fails === 6) for (const l of subs[col] || []) l.err && l.err({ code: e.code || 'error' }); }
    finally { running[col] = false; if (pending[col]) { pending[col] = false; kick(col); } }
  }
  let timer = null;
  const tick = () => { if (!document.hidden) Object.keys(subs).forEach(kick); };
  window.addEventListener('focus', tick); document.addEventListener('visibilitychange', tick); window.addEventListener('online', tick);
  return {
    doc(path) {
      const [col, id] = path.split('/'), name = id + '.json';
      return {
        id, path,
        async set(data) {
          const body = JSON.stringify(data);
          let r; try { r = await gfetch('/drives/' + ctx.drive + '/items/' + ctx.cols[col] + ':/' + encodeURIComponent(name) + ':/content', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body }); }

        }
      };

    collection(col) {
      return { onSnapshot(next, err) {
        const l = { next, err, seen: -1 }; (subs[col] = subs[col] || new Set()).add(l);
        if (!timer) timer = setInterval(tick, pollMs());
        kick(col);
        return () => subs[col].delete(l);
      } };
    }
  };
}

    v.process = d.process.slice(0, 12).filter(p => p && !empty(p.step)).map(p => ({ step: str(p.step), details: str(p.details), owner: str(p.owner), duration: str(p.duration) }));
    pr = v.process.length; v.tr = {};
  }
  const qs = Array.isArray(d.questions_for_client) ? d.questions_for_client.map(str).filter(Boolean).slice(0, 8) : [];
  if (qs.length) v.questions = qs;
  touch('vacancies', v); renderAll();
  return { n, r: rq, p: pr, q: qs.length };
}
async function translateDoc() {
  const v = curVac(), c = curClient(); if (!v || !SAMPLE) return;
  const src = origLang(v), dst = S.lang, btn = $('#btn-translate'); if (src === dst) return;
  const payload = { client: {}, role: {}, requirements: v.requirements.map(r => ({ skill: r.skill, notes: r.notes })), process: v.process.map(p => ({ step: p.step, details: p.details })) };
  if (c) [...TX_C].forEach(k => { if (!empty(c[k])) payload.client[k] = c[k]; });
  [...TX_V].forEach(k => { if (!empty(v[k])) payload.role[k] = v[k]; });
  if (btn) { btn.disabled = true; btn.replaceChildren(h('span', { class: 'spin' }), T('translating')); }
  try {
    const out = await SAMPLE.json(`Translate every string value of this JSON from ${LANG_NAME[src]} to ${LANG_NAME[dst]}. Keep the keys, the structure, the order and the number of array items exactly. Keep URLs, company and product names, numbers and line breaks. Lines that start with "- " keep it. Reply with only the translated JSON.\n\n${JSON.stringify(payload)}`, { modelTier: 'default', cache: false });
    if (c && out.client) { c.tr = c.tr || {}; c.tr[dst] = { f: {} }; [...TX_C].forEach(k => { if (typeof out.client[k] === 'string') c.tr[dst].f[k] = out.client[k]; }); touch('clients', c); }
    v.tr = v.tr || {}; v.tr[dst] = { f: {}, req: [], proc: [] };
    [...TX_V].forEach(k => { if (out.role && typeof out.role[k] === 'string') v.tr[dst].f[k] = out.role[k]; });
    v.requirements.forEach((r, i) => v.tr[dst].req.push({ skill: str(out.requirements?.[i]?.skill), notes: str(out.requirements?.[i]?.notes) }));
    v.process.forEach((p, i) => v.tr[dst].proc.push({ step: str(out.process?.[i]?.step), details: str(out.process?.[i]?.details) }));
    touch('vacancies', v); toast(T('translated')); renderAll();
  } catch (e) { const msg = aiMsg(e); if (msg) toast(msg); if (btn) { btn.disabled = false; btn.textContent = T(v.tr?.[dst] ? 'retranslate' : 'translate', { c: LANG_NAME[dst] }); } }
}
function runOutput(kind) {
  const v = curVac(); if (!v || !SAMPLE) return;
  const ficha = toText(buildModel(S.lang)), lang = LANG_NAME[S.lang], miss = missingList(v).map(labelOf).join('; ');
  const prompts = {
    summary: `Write a recruiter-ready summary of this role for sourcers, in ${lang}. At most 180 words, plain text, short paragraphs, no markdown headings. Cover who the client is, the role, the must-have skills with their weight, compensation, work modality, the selection process and what is still unknown. Use only the data below.\n\n${ficha}`,
    boolean: `From this role, write in ${lang}: 3 LinkedIn Boolean search strings (broad, balanced, narrow) that combine title synonyms with the mandatory skills (AND) and alternative spellings (OR), then 5 Sales Navigator filter suggestions (title, seniority, geography, years of experience, keywords). Plain text, one string per line, no markdown. Use only the data below.\n\n${ficha}`,
    questions: `A recruiter is preparing the next call with the client. Write in ${lang} the 8 most useful questions to ask, ordered by priority, to close these gaps: ${miss || '(none; ask about risks and timeline)'}. Plain numbered list. Role data:\n\n${ficha}`
  };
  const titles = { summary: 'gSummary', boolean: 'gBoolean', questions: 'gQuestions' };
  const out = h('div', { class: 'out', 'aria-live': 'polite' }, h('span', { class: 'spin' }), T('thinking'));
  let ctl = new AbortController(), text = '';
  const stop = h('button', { class: 'btn', onclick: () => ctl.abort() }, T('stop'));
  const cp = h('button', { class: 'btn primary', disabled: true, onclick: () => copyText(text) }, T('copyTxt'));
  const m = modal(T(titles[kind]), [out], [stop, cp]);
  SAMPLE(prompts[kind], { signal: ctl.signal, modelTier: 'default', cache: false, onText: ({ text: t }) => { text = t; out.textContent = t; } })
    .then(r => { text = r.text; out.textContent = r.text; cp.disabled = false; stop.style.display = 'none'; })
    .catch(e => { const msg = aiMsg(e); if (e?.text) { text = e.text; out.textContent = e.text; cp.disabled = false; } else out.textContent = msg || ''; stop.style.display = 'none'; });
}

const use = async name => { try { return (await window.claude?.use?.(name)) ?? null; } catch { return null; } };
async function boot() {
  document.addEventListener('click', e => { if (S.menu && !e.target.closest('.actions')) { S.menu = false; renderBar(); } });
  renderAll();
  [DB, SAMPLE, DOWNLOADS] = await Promise.all([use('db'), use('sample'), use('downloads')]);
  if (DB) { S.dbOk = true; subscribe(); }
  else { S.dbOk = false; S.clients = JSON.parse(JSON.stringify(DEMO.clients)); S.vacs = JSON.parse(JSON.stringify(DEMO.vacancies)); S.sel = sortedVacs()[0]?.id || null; }
  renderAll();
}
boot();
})();
